# ============================================================================
# TicketMaster Platform — Docker Compose (WSL Ubuntu + Docker)
#
# EXECUÇÃO EM DUAS ETAPAS (corrigido p/ WSL/Docker real):
#   1) Infraestrutura apenas (sobe agora, sem precisar do código .NET):
#        docker compose up -d
#      Sobe: postgres, redis, kafka, debezium, elasticsearch, jaeger, prometheus.
#
#   2) Stack completa (infra + serviços .NET 10, exige o scaffold em ../solution):
#        docker compose --profile app up -d --build
#
# Os serviços .NET usam Dockerfiles em ../solution/src/<Service>/Dockerfile
# (multi-stage: build mcr.microsoft.com/dotnet/sdk:10.0 → runtime aspnet:10.0).
# Eles NÃO são expostos ao host; o único ponto de entrada é o api-gateway (8080).
# ============================================================================

name: ticketmaster

services:
  # ------------------------------------------------------------------ Postgres
  postgres:
    image: postgres:17-alpine
    container_name: tm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketmaster}
      POSTGRES_DB: ${POSTGRES_DB:-ticketmaster}
    # logical + pgoutput (CDC/Debezium) + slot p/ réplicas
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: tm-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------- Kafka
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: tm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------- Debezium Connect
  debezium:
    image: debezium/connect:3.0
    container_name: tm-debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: tm-connect
      CONFIG_STORAGE_TOPIC: tm.connect.configs
      OFFSET_STORAGE_TOPIC: tm.connect.offsets
      STATUS_STORAGE_TOPIC: tm.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    volumes:
      - ./debezium/register-connector.sh:/register-connector.sh:ro

  # --------------------------------------------------------- Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: tm-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------------------------------------------- Serviços .NET 10 (profile app)
  api-gateway:
    profiles: ["app"]
    build:
      context: ../solution
      dockerfile: src/ApiGateway/Dockerfile
    container_name: tm-api-gateway
    depends_on:
      - event-service
      - search-service
      - booking-service
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

  event-service:
    profiles: ["app"]
    build:
      context: ../solution
      dockerfile: src/EventService/Dockerfile
    container_name: tm-event-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketmaster};Username=${POSTGRES_USER:-ticketmaster};Password=${POSTGRES_PASSWORD:-ticketmaster}
      ConnectionStrings__Redis: redis:6379

  search-service:
    profiles: ["app"]
    build:
      context: ../solution
      dockerfile: src/SearchService/Dockerfile
    container_name: tm-search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Elasticsearch__Uri: http://elasticsearch:9200

  booking-service:
    profiles: ["app"]
    build:
      context: ../solution
      dockerfile: src/BookingService/Dockerfile
    container_name: tm-booking-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketmaster};Username=${POSTGRES_USER:-ticketmaster};Password=${POSTGRES_PASSWORD:-ticketmaster}
      ConnectionStrings__Redis: redis:6379
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}

  worker:
    profiles: ["app"]
    build:
      context: ../solution
      dockerfile: src/Worker/Dockerfile
    container_name: tm-worker
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9092
      Elasticsearch__Uri: http://elasticsearch:9200
      # Worker expõe /metrics p/ Prometheus (OpenTelemetry.Exporter.Prometheus.AspNetCore)

  # --------------------------------------------------------- Observabilidade
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: tm-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: tm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

volumes:
  pgdata:
  esdata:

networks:
  default:
    name: ticketmaster-net
